name: Build App

# 推送 main 自动构建;也可在 Actions 页面手动触发(workflow_dispatch)。
# 产物以未签名 .app 形式发布到 nightly release,方便直接下载使用。
# 本 fork 新增 Ice/Resources/zh-Hans.lproj/Localizable.strings(简体中文汉化)。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# 防止并发构建互相覆盖 nightly release:同一时间只允许一个构建任务,
# 排队执行,保证 release 上永远是最新 commit 的产物。
concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  build:
    name: Release Build (unsigned)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app && xcodebuild -version

      # CODE_SIGNING_ALLOWED=NO:runner 没有签名证书,出未签名产物,
      # 本地用 `codesign --force --deep -s -` 临时签名即可运行。
      # SPM 依赖解析由 build 自动完成,日志全程落盘便于失败时排查。
      - name: Build (Release)
        run: |
          set -o pipefail
          xcodebuild \
            -project Ice.xcodeproj \
            -scheme Ice \
            -configuration Release \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Package
        run: |
          cd build/dd/Build/Products/Release
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Ice.app Ice.zip
          ls -lh Ice.zip

      - name: Verify zh-Hans bundled
        run: |
          ls build/dd/Build/Products/Release/Ice.app/Contents/Resources/ | grep -i "zh-Hans" \
            && echo "简体中文语言包已打入" || (echo "警告: 未找到 zh-Hans.lproj" && exit 1)

      - name: Publish to nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build (zh-Hans)
          body: |
            自动构建产物(未签名,来自最新 main)。含简体中文汉化(zh-Hans.lproj)。

            本地使用:
            ```
            xattr -cr Ice.app
            codesign --force --deep -s - Ice.app
            ```
          files: build/dd/Build/Products/Release/Ice.zip
          make_latest: false
